# MorphUtils shell + embedded module UIs (Event Logs, Content Maker, Project, Morph AI).
# Backends are not on Netlify — set MORPH_API_ORIGIN (and optional module API URLs) in the Netlify UI, then redeploy.
# Full stack with APIs: render.yaml + deploy/README.md.

[build]
  command = "npm run netlify-build"
  publish = "netlify-dist"

[build.environment]
  NODE_VERSION = "20"
