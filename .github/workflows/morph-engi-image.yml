# Image build for Project (morph-engi).
#
# This is not one of the five required check names. Those stay in ci.yml.
# Do not move this job into ci.yml.
name: Project image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morph-engi-image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build Project image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contract
        run: sh morph-engi/deploy/check-container-contract.sh
      - name: Blueprint schema
        run: |
          python3 -m venv /tmp/render-schema
          /tmp/render-schema/bin/pip install --disable-pip-version-check 'check-jsonschema==0.33.2'
          /tmp/render-schema/bin/check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
      - name: Build
        run: docker build -f morph-engi/Dockerfile -t morph-engi:ci .
