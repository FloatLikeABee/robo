# Image build for Event Logs API + UI.
#
# This is not one of the five required check names. Those stay in ci.yml
# (Go / Morph API, Go / Event Logs, Go / Content Maker, Go / morphai,
# Morph frontend). Do not move this job into ci.yml.
name: Event Logs image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formx-image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build Event Logs image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contract
        run: sh formx/deploy/check-container-contract.sh
      - name: Build
        run: docker build -f formx/Dockerfile -t formx:ci .
