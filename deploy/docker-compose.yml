# Dorph API + Dorph AI UI. From the repo root:
#   cp deploy/.env.production.example deploy/.env.production
#   docker compose -f deploy/docker-compose.yml up --build
# Caddy is profile "tls" only (issue #53). It does not start by default.

services:
  dorph:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Shell or deploy/.env only. env_file is runtime and CRA already inlined this.
        REACT_APP_DORPH_UTILS_URL: ${REACT_APP_DORPH_UTILS_URL:-}
    image: dorph:local
    env_file:
      - .env.production
    ports:
      - "${DORPH_PUBLISH_PORT:-9090}:9090"
    volumes:
      - dorph-data:/data
    restart: unless-stopped

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      dorph:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  dorph-data:
  caddy-data:
  caddy-config:
