basePath: /
definitions:
  handler.PublicFormResponse:
    properties:
      form:
        $ref: '#/definitions/models.Form'
      questions:
        items:
          $ref: '#/definitions/models.Question'
        type: array
      rules:
        items:
          $ref: '#/definitions/models.QuestionRule'
        type: array
    type: object
  models.AnswerEntry:
    properties:
      filename:
        type: string
      question_id:
        type: integer
      size:
        type: integer
      type:
        type: string
      value: {}
    type: object
  models.AnswerInput:
    properties:
      question_id:
        type: integer
      value: {}
    required:
    - question_id
    type: object
  models.CreateFormRequest:
    properties:
      description:
        type: string
      name:
        type: string
      single_response_only:
        type: boolean
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  models.CreateQuestionRequest:
    properties:
      config:
        $ref: '#/definitions/models.QuestionConfig'
      required:
        type: boolean
      sort_order:
        type: integer
      title:
        type: string
      type:
        type: string
    required:
    - title
    - type
    type: object
  models.CreateRuleRequest:
    properties:
      condition:
        type: string
      depends_on_question_id:
        type: integer
    required:
    - condition
    - depends_on_question_id
    type: object
  models.Form:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      questions:
        items:
          $ref: '#/definitions/models.Question'
        type: array
      single_response_only:
        type: boolean
      slug:
        type: string
      updated_at:
        type: string
    type: object
  models.FormListResponse:
    properties:
      forms:
        items:
          $ref: '#/definitions/models.Form'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  models.FormResponse:
    properties:
      answers:
        items:
          $ref: '#/definitions/models.AnswerEntry'
        type: array
      form_id:
        type: integer
      id:
        type: string
      respondent_id:
        type: string
      slug:
        type: string
      submitted_at:
        type: string
    type: object
  models.OptionItem:
    properties:
      label:
        type: string
      value:
        type: integer
    type: object
  models.Question:
    properties:
      config:
        $ref: '#/definitions/models.QuestionConfig'
      created_at:
        type: string
      form_id:
        type: integer
      id:
        type: integer
      required:
        type: boolean
      sort_order:
        type: integer
      title:
        type: string
      type:
        description: text, integer, select, multiselect, float, boolean, date, datetime,
          image, document, qrcode
        type: string
      updated_at:
        type: string
    type: object
  models.QuestionConfig:
    properties:
      allowed_extensions:
        items:
          type: string
        type: array
      allowed_mime:
        type: string
      max:
        type: number
      max_selections:
        type: integer
      max_size:
        type: integer
      min:
        type: number
      multiline:
        type: boolean
      options:
        items:
          $ref: '#/definitions/models.OptionItem'
        type: array
      validation_pattern:
        type: string
    type: object
  models.QuestionRule:
    properties:
      condition:
        description: '"answered" | "not_answered"'
        type: string
      created_at:
        type: string
      depends_on_question_id:
        type: integer
      id:
        type: integer
      question_id:
        description: question this rule applies to
        type: integer
      updated_at:
        type: string
    type: object
  models.ResponseListResult:
    properties:
      limit:
        type: integer
      page:
        type: integer
      responses:
        items:
          $ref: '#/definitions/models.FormResponse'
        type: array
      total:
        type: integer
    type: object
  models.SubmitRequest:
    properties:
      answers:
        items:
          $ref: '#/definitions/models.AnswerInput'
        type: array
      respondent_id:
        type: string
    required:
    - answers
    type: object
  models.UpdateFormRequest:
    properties:
      description:
        type: string
      name:
        type: string
      single_response_only:
        type: boolean
      slug:
        type: string
    type: object
  models.UpdateQuestionRequest:
    properties:
      config:
        $ref: '#/definitions/models.QuestionConfig'
      required:
        type: boolean
      sort_order:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
