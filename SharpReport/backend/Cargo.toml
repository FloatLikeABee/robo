[package]
name = "datapulse"
version = "0.1.0"
edition = "2024"
authors = ["DataPulse Team <dev@datapulse.app>"]
description = "Metabase-powered analytics platform backend"
license = "Proprietary"
repository = "https://github.com/datapulse/datapulse"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "uuid", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
config = { version = "0.14", features = ["toml"] }
validator = { version = "0.16", features = ["derive"] }
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
once_cell = "1.19"
futures = "0.3"
rand = "0.8"
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
aes-gcm = "0.10"
base64 = "0.21"
morphai = { path = "../../pkg/morphai-rs" }

[dev-dependencies]
tempfile = "3.9"
mockall = "0.13"