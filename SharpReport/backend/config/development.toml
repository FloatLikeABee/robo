[server]
port = 3050

[database]
url = "sqlite://./data/datapulse.db"

[jwt]
secret = "dev-secret-key"
expiry_hours = 24

[users_panel]
base_url = "http://127.0.0.1:9090"

[metabase]
autostart = false
jar_path = "./metabase/metabase.jar"
download_url = "https://downloads.metabase.com/latest/metabase.jar"
host = "127.0.0.1"
port = 8001
db_type = "h2"
jvm_opts = "-Xmx1g -Xms512m"

[cors]
allowed_origins = [
  "http://localhost:5173",
  "http://localhost:5178",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5178",
  "http://localhost:3050",
  "http://127.0.0.1:3050",
]