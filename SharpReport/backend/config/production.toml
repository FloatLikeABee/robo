[server]
port = 3050

[database]
url = "postgresql://datapulse:secret@localhost:5432/datapulse"

[jwt]
secret = "production-secret-key-change-me"
expiry_hours = 24

[metabase]
autostart = false
jar_path = "/app/metabase/metabase.jar"
