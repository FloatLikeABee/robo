# Dorph API + Dorph AI UI, the DorphUtils shell, Event Logs, Content Maker,
# Data Access, and Project. Attach this file to the existing Render project.
# Secrets and public origins that are filled in the dashboard are prompts. Do
# not put values on those keys. VITE_DORPH_API_URL and USERS_PANEL_BASE_URL are
# public origin prompts, not secrets. REACT_APP_DORPH_UTILS_URL is a dorph
# dashboard prompt with no value. Embed origins are prompts on dorph-utils
# only (sync: false, no value). Do not put an onrender.com host in this file.
services:
  - type: web
    runtime: docker
    name: dorph
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - dorph/**
        - pkg/**
        - Dockerfile
        - .dockerignore
        - scripts/with-root-env.cjs
        - deploy/docker-entrypoint.sh
        - render.yaml
    disk:
      name: dorph-data
      mountPath: /data
      sizeGB: 1
    # REACT_APP_DORPH_UTILS_URL is a Docker build arg. CRA inlines it. Empty or
    # loopback omits the DorphUtils header chip. Do not put a URL on the key.
    envVars:
      - key: DORPH_ENV
        value: production
      - key: PORT
        value: "9090"
      - key: GIN_MODE
        value: release
      - key: DORPH_AI_PROVIDER
        value: dashscope
      - key: ADMIN_USERNAME
        value: dorphadmin
      - key: ADMIN_EMAIL
        value: dorphadmin@local.com
      - key: DB_PATH
        value: /data/badger
      - key: TRAN_SQLITE_PATH
        value: /data/tran.sqlite
      - key: ENTITY_DETAILS_BADGER
        value: /data/entity_details
      - key: DORPH_KNOWLEDGE_DIR
        value: /data/knowledge
      - key: TRAN_ENTITY_ATTACHMENT_DIR
        value: /data/uploads/entity_attachments
      - key: REACT_APP_DORPH_UTILS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DORPH_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRAN_QWEN_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      - key: DORPH_IMAGE_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TRAN_MYSQL_DSN
        sync: false
      - key: TRAN_MONGO_URI
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: TRAN_OPENAI_API_KEY
        sync: false

  # DorphUtils shell only. No disk. Embed origins are not set on this service.
  - type: web
    runtime: docker
    name: dorph-utils
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./dorph-utils/Dockerfile
    dockerContext: ./dorph-utils
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - dorph-utils/frontend/**
        - dorph-utils/Dockerfile
        - dorph-utils/.dockerignore
        - dorph-utils/deploy/docker-entrypoint.sh
        - dorph-utils/deploy/nginx.conf.template
        - render.yaml
    envVars:
      - key: PORT
        value: "3040"
      # Public Dorph origin, filled in the dashboard. Not a secret.
      - key: VITE_DORPH_API_URL
        sync: false
      # Embed origins. Dashboard prompts. Not secrets. No host in git.
      - key: VITE_SHEETX_URL
        sync: false
      - key: VITE_FORMSX_URL
        sync: false
      - key: VITE_COMPOSERX_URL
        sync: false
      - key: VITE_DATAX_URL
        sync: false
      - key: VITE_PROJECTS_URL
        sync: false
      - key: VITE_DORPH_ENGI_URL
        sync: false
      - key: VITE_DORPH_AI_URL
        sync: false

  # Event Logs API + UI. One disk. The DorphUtils iframe origin is VITE_SHEETX_URL on dorph-utils.
  - type: web
    runtime: docker
    name: formx
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./formx/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - formx/**
        - pkg/**
        - formx/Dockerfile
        - formx/Dockerfile.dockerignore
        - formx/deploy/docker-entrypoint.sh
        - render.yaml
    disk:
      name: formx-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "29909"
      - key: FORMSX_SQLITE_PATH
        value: /data/formsx.sqlite
      - key: FORMSX_BADGER_PATH
        value: /data/formsx_badger
      - key: UPLOAD_DIR
        value: /data/uploads
      # Public Dorph origin. Not a secret.
      - key: USERS_PANEL_BASE_URL
        sync: false
      - key: PUBLIC_FORM_BASE_URL
        sync: false
      - key: DORPH_AI_API_KEY
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # Content Maker API + UI. SQLite and Badger need the disk. One instance.
  - type: web
    runtime: docker
    name: composerx
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./composerx/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - composerx/**
        - pkg/**
        - composerx/Dockerfile
        - .dockerignore
        - composerx/deploy/docker-entrypoint.sh
        - render.yaml
    disk:
      name: composerx-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8043"
      - key: COMPOSERX_PORT
        value: "8043"
      - key: GIN_MODE
        value: release
      - key: COMPOSERX_SQLITE_PATH
        value: /data/composerx.sqlite
      - key: COMPOSERX_BADGER_PATH
        value: /data/composerx_badger
      - key: TRAN_FILE_STORAGE_PATH
        value: /data/storage
      # Public Dorph origin, no path. Not a secret. Do not invent the host.
      - key: USERS_PANEL_BASE_URL
        sync: false
      - key: DORPH_AI_API_KEY
        sync: false
      - key: TRAN_QWEN_API_KEY
        sync: false
      - key: TRAN_OPENAI_API_KEY
        sync: false

  # Data Access API + UI. SQLite on one disk. Embed URL is story #114.
  - type: web
    runtime: docker
    name: sharpreport
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./SharpReport/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - SharpReport/**
        - pkg/dorphai-rs/**
        - SharpReport/Dockerfile
        - SharpReport/deploy/docker-entrypoint.sh
        - .dockerignore
        - render.yaml
    disk:
      name: sharpreport-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "3050"
      - key: SHARPREPORT_PORT
        value: "3050"
      - key: SHARPREPORT_DATABASE_URL
        value: "sqlite:///data/datapulse.db"
      - key: SHARPREPORT_UI_DIR
        value: /app/ui
      - key: RUST_LOG
        value: info
      # Dorph auth base URL. Not a secret. No value in git.
      - key: USERS_PANEL_BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DORPH_AI_API_KEY
        sync: false

  # Project (DorphUtils module id projects). VITE_PROJECTS_URL and
  # VITE_DORPH_ENGI_URL are prompts on dorph-utils, not on this service.
  - type: web
    runtime: docker
    name: dorph-engi
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./dorph-engi/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - dorph-engi/**
        - pkg/dorphai-rs/**
        - dorph-engi/Dockerfile
        - dorph-engi/Dockerfile.dockerignore
        - dorph-engi/deploy/docker-entrypoint.sh
        - render.yaml
    disk:
      name: dorph-engi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "9096"
      - key: STATIC_DIR
        value: /app/frontend/dist
      - key: DORPH_ENGI_DATABASE_URL
        value: sqlite:///data/dorph_engi.db
      - key: DORPH_ENGI_UPLOAD_DIR
        value: /data/uploads
      # Public Dorph origin, filled in the dashboard. Not a secret.
      - key: USERS_PANEL_BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DORPH_AI_API_KEY
        sync: false
