# Morph API + Morph AI UI, the MorphUtils shell, Event Logs, Content Maker,
# and Data Access. Attach this file to the existing Render project. Secrets
# and public origins that are filled in the dashboard are prompts. Do not put
# values on those keys. VITE_MORPH_API_URL and USERS_PANEL_BASE_URL are public
# origin prompts, not secrets. Do not set VITE_SHEETX_URL, VITE_DATAX_URL, or
# REACT_APP_MORPH_UTILS_URL here.
services:
  - type: web
    runtime: docker
    name: morph
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - morph/**
        - pkg/**
        - Dockerfile
        - .dockerignore
        - scripts/with-root-env.cjs
        - deploy/docker-entrypoint.sh
        - render.yaml
    disk:
      name: morph-data
      mountPath: /data
      sizeGB: 1
    # Optional Docker build arg: REACT_APP_MORPH_UTILS_URL. Unset or loopback
    # omits the MorphUtils header link. Set a public URL when Utils is hosted.
    envVars:
      - key: MORPH_ENV
        value: production
      - key: PORT
        value: "9090"
      - key: GIN_MODE
        value: release
      - key: MORPH_AI_PROVIDER
        value: dashscope
      - key: ADMIN_USERNAME
        value: morphadmin
      - key: ADMIN_EMAIL
        value: morphadmin@local.com
      - key: DB_PATH
        value: /data/badger
      - key: TRAN_SQLITE_PATH
        value: /data/tran.sqlite
      - key: ENTITY_DETAILS_BADGER
        value: /data/entity_details
      - key: MORPH_KNOWLEDGE_DIR
        value: /data/knowledge
      - key: TRAN_ENTITY_ATTACHMENT_DIR
        value: /data/uploads/entity_attachments
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: MORPH_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRAN_QWEN_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      - key: MORPH_IMAGE_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TRAN_MYSQL_DSN
        sync: false
      - key: TRAN_MONGO_URI
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: TRAN_OPENAI_API_KEY
        sync: false

  # MorphUtils shell only. No disk. Embed origins are not set on this service.
  - type: web
    runtime: docker
    name: morph-utils
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./morph-utils/Dockerfile
    dockerContext: ./morph-utils
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - morph-utils/frontend/**
        - morph-utils/Dockerfile
        - morph-utils/.dockerignore
        - morph-utils/deploy/docker-entrypoint.sh
        - morph-utils/deploy/nginx.conf.template
        - render.yaml
    envVars:
      - key: PORT
        value: "3040"
      # Public Morph origin, filled in the dashboard. Not a secret.
      - key: VITE_MORPH_API_URL
        sync: false

  # Event Logs API + UI. One disk. MorphUtils iframe origin is story #114.
  - type: web
    runtime: docker
    name: formx
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./formx/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - formx/**
        - pkg/**
        - formx/Dockerfile
        - formx/Dockerfile.dockerignore
        - formx/deploy/docker-entrypoint.sh
        - render.yaml
    disk:
      name: formx-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "29909"
      - key: FORMSX_SQLITE_PATH
        value: /data/formsx.sqlite
      - key: FORMSX_BADGER_PATH
        value: /data/formsx_badger
      - key: UPLOAD_DIR
        value: /data/uploads
      # Public Morph origin. Not a secret.
      - key: USERS_PANEL_BASE_URL
        sync: false
      - key: PUBLIC_FORM_BASE_URL
        sync: false
      - key: MORPH_AI_API_KEY
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # Content Maker API + UI. SQLite and Badger need the disk. One instance.
  - type: web
    runtime: docker
    name: composerx
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./composerx/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - composerx/**
        - pkg/**
        - composerx/Dockerfile
        - .dockerignore
        - composerx/deploy/docker-entrypoint.sh
        - render.yaml
    disk:
      name: composerx-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8043"
      - key: COMPOSERX_PORT
        value: "8043"
      - key: GIN_MODE
        value: release
      - key: COMPOSERX_SQLITE_PATH
        value: /data/composerx.sqlite
      - key: COMPOSERX_BADGER_PATH
        value: /data/composerx_badger
      - key: TRAN_FILE_STORAGE_PATH
        value: /data/storage
      # Public Morph origin, no path. Not a secret. Do not invent the host.
      - key: USERS_PANEL_BASE_URL
        sync: false
      - key: MORPH_AI_API_KEY
        sync: false
      - key: TRAN_QWEN_API_KEY
        sync: false
      - key: TRAN_OPENAI_API_KEY
        sync: false

  # Data Access API + UI. SQLite on one disk. Embed URL is story #114.
  - type: web
    runtime: docker
    name: sharpreport
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./SharpReport/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    buildFilter:
      paths:
        - SharpReport/**
        - pkg/morphai-rs/**
        - SharpReport/Dockerfile
        - SharpReport/deploy/docker-entrypoint.sh
        - .dockerignore
        - render.yaml
    disk:
      name: sharpreport-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "3050"
      - key: SHARPREPORT_PORT
        value: "3050"
      - key: SHARPREPORT_DATABASE_URL
        value: "sqlite:///data/datapulse.db"
      - key: SHARPREPORT_UI_DIR
        value: /app/ui
      - key: RUST_LOG
        value: info
      # Morph auth base URL. Not a secret. No value in git.
      - key: USERS_PANEL_BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MORPH_AI_API_KEY
        sync: false
