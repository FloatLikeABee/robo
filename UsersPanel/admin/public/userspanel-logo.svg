<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Users Panel">
  <defs>
    <linearGradient id="up-bg" x1="8%" y1="6%" x2="92%" y2="94%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="78%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="up-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="up-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#up-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#up-shine)"/>
  <!-- panel grid -->
  <g opacity="0.35" stroke="#e8eff7" stroke-width="10" fill="none">
    <rect x="96" y="340" width="320" height="72" rx="14"/>
    <line x1="176" y1="340" x2="176" y2="412"/>
    <line x1="256" y1="340" x2="256" y2="412"/>
    <line x1="336" y1="340" x2="336" y2="412"/>
  </g>
  <!-- users -->
  <g fill="none" stroke="#f0f7ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#up-glow)">
    <circle cx="256" cy="168" r="46"/>
    <path d="M168 292c0-48 39-86 88-86s88 38 88 86"/>
    <circle cx="148" cy="188" r="32" opacity="0.85"/>
    <path d="M96 278c0-34 24-62 52-62" opacity="0.85"/>
    <circle cx="364" cy="188" r="32" opacity="0.85"/>
    <path d="M416 278c0-34-24-62-52-62" opacity="0.85"/>
  </g>
  <!-- badge -->
  <circle cx="392" cy="120" r="44" fill="#e3bc3a"/>
  <path d="M372 120l14 14 28-28" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
